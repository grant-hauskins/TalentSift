name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version and the newest one the team uses.
        python-version: ["3.11", "3.14"]
    env:
      # CI always runs offline with the deterministic fake client.
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest
