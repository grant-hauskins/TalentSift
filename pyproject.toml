[project]
name = "talentsift"
version = "0.2.0"
description = "Fair, explainable resume screening for employers and a fact-anchored drafting assistant for candidates (course MVP)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:pdfminer.*",
]
